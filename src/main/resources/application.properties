# Server Configuration
server.port=${PORT:8080}

# Import optional local properties (not committed to Git)
spring.config.import=optional:file:application-local.properties

# MySQL DataSource Configuration
# Render supplies DB_URL, DB_USERNAME and DB_PASSWORD
# Local development uses the defaults below
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/student_collab_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration
# Set JWT_SECRET in application-local.properties locally
# Set JWT_SECRET in Render Environment Variables in production
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# File Upload Settings
app.upload.dir=./uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# CORS Configuration
# Render: set CORS_ALLOWED_ORIGINS to frontend URL, e.g. https://collabhub-frontend.onrender.com
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

